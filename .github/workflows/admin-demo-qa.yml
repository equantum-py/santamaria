name: Santa Maria Admin Stage 01 QA

on:
  push:
    branches:
      - codex/santamaria-admin-demo

permissions:
  contents: read
  deployments: read

jobs:
  admin-stage-01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Resolve Vercel Preview URL
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 20,
              });
              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 20,
                });
                const ready = statuses.find((status) =>
                  status.state === 'success' &&
                  status.environment_url &&
                  status.environment_url.includes('santamaria') &&
                  status.environment_url.includes('.vercel.app')
                );
                if (ready) {
                  core.setOutput('url', ready.environment_url);
                  core.info(`Vercel Preview READY: ${ready.environment_url}`);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error(`No READY Vercel Preview found for commit ${sha}`);

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local production build
        run: npm run start -- --hostname 127.0.0.1 --port 4173 > /tmp/santamaria-admin.log 2>&1 &

      - name: Capture and verify admin desktop and mobile
        env:
          ADMIN_BASE_URL: http://127.0.0.1:4173
        run: node scripts/qa/admin-stage01.mjs

      - name: Record preview link
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: 'echo "Vercel Preview READY: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"'

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: santamaria-admin-stage01-qa
          path: artifacts/admin-stage01/
          if-no-files-found: warn
          retention-days: 30
