name: Typography and pricing QA

on:
  push:
    branches:
      - codex/mejora-tipografia-precios-santamaria
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: read

jobs:
  visual-preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Find successful Vercel Preview
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 20,
              });
              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 20,
                });
                const failed = statuses.find((status) => ['failure', 'error'].includes(status.state));
                if (failed) {
                  throw new Error(`Vercel Preview failed: ${failed.description || failed.state} ${failed.target_url || ''}`);
                }
                const ready = statuses.find((status) =>
                  status.state === 'success' &&
                  status.environment_url &&
                  status.environment_url.includes('santamaria') &&
                  status.environment_url.includes('.vercel.app')
                );
                if (ready) {
                  core.setOutput('url', ready.environment_url);
                  core.info(`Preview ready: ${ready.environment_url}`);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error(`No successful Vercel Preview found for commit ${sha}`);

      - name: Capture and validate desktop and mobile Preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/qa/typography-pricing.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: santamaria-typography-pricing-qa
          path: artifacts/typography-pricing/
          if-no-files-found: warn
          retention-days: 30
