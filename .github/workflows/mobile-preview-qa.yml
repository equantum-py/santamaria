name: Mobile Preview QA

on:
  push:
    branches:
      - codex/investigacion-imagenes-productos
  workflow_dispatch:
    inputs:
      preview_url:
        description: Vercel Preview URL for Santa María
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  mobile-preview:
    if: github.ref == 'refs/heads/codex/investigacion-imagenes-productos'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check committed changes for whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Locate successful Vercel Preview
        id: preview
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha: context.sha,
                per_page: 20,
              });
              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 20,
                });
                const ready = statuses.find((status) =>
                  status.state === 'success' &&
                  status.environment_url &&
                  status.environment_url.includes('santamaria') &&
                  status.environment_url.includes('.vercel.app')
                );
                if (ready) {
                  core.setOutput('url', ready.environment_url);
                  core.info(`Preview ready: ${ready.environment_url}`);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error(`No successful Vercel Preview found for commit ${context.sha}`);

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify standard production build
        run: npm run build

      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Request short-lived Vercel Trusted Source token
        id: vercel_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/equantum-py');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            if (claims.aud !== 'https://github.com/equantum-py') {
              throw new Error(`Unexpected OIDC audience: ${claims.aud}`);
            }
            if (claims.repository !== 'equantum-py/santamaria' ||
                claims.ref !== 'refs/heads/codex/investigacion-imagenes-productos') {
              throw new Error(`OIDC source mismatch: ${claims.repository} @ ${claims.ref}`);
            }
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Test and capture Preview at mobile widths
        env:
          PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || steps.preview.outputs.url }}
          VERCEL_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
        run: node scripts/qa/mobile-preview.mjs

      - name: Upload mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: santamaria-mobile-preview-qa
          path: artifacts/mobile/
          if-no-files-found: warn
          retention-days: 30
